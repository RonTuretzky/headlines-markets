# Daily settlement bot (backlog D7): reads the alert mailbox over IMAP, matches every
# newspaper email against the live markets, and submits DKIM proofs onchain.
#
# Repo secrets (set them yourself — never paste them in chat):
#   GMAIL_USER          the mailbox subscribed to the newspapers' breaking-news alerts
#   GMAIL_APP_PASSWORD  a Gmail App Password (Google Account → Security → 2-Step
#                       Verification → App passwords); IMAP must be enabled
#   PRIVATE_KEY         funded settler key (same throwaway deployer key works); omit to dry-run
name: Settle
on:
  schedule:
    - cron: "17 13 * * *" # daily 13:17 UTC
  workflow_dispatch:
    inputs:
      network:
        description: "gnosis | sepolia"
        default: "gnosis"
      since:
        description: "how far back to scan the mailbox (e.g. 2d, 12h)"
        default: "2d"
      dry_run:
        description: "simulate only (no transactions)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run settlement bot
        working-directory: app
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PRIVATE_KEY: ${{ inputs.dry_run == true && '' || secrets.PRIVATE_KEY }}
          RPC_OVERRIDE: ${{ secrets.RPC_OVERRIDE }}
        run: |
          node scripts/settlement-bot.mjs \
            --network "${{ inputs.network || 'gnosis' }}" \
            --since "${{ inputs.since || '2d' }}" \
            --out settle-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settle-report-${{ github.run_id }}
          path: app/settle-report.json
          if-no-files-found: ignore
